name: Publish consolidated Gauntlex curriculum

on:
  push:
    branches: [main]
    paths:
      - "gauntlex/**/README.md"
      - "tools/build_gauntlex_master.py"
      - "scripts/audit_readme_contracts.py"
      - ".github/workflows/publish-curriculum.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Report README and starter inconsistencies
        run: python scripts/audit_readme_contracts.py
      - name: Assemble the 409 learner assignments
        run: python tools/build_gauntlex_master.py
      - name: Commit generated curriculum if changed
        run: |
          git add GAUNTLEX_PYTHON_CURRICULUM.md
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "docs: publish consolidated 409-challenge curriculum"
            git push
          fi
