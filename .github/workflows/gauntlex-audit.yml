name: Gauntlex curriculum static audit

on:
  push:
    paths:
      - "gauntlex/**"
      - "scripts/audit_gauntlex.py"
      - "scripts/source_traceability.py"
      - "scripts/check_foundations_starters.py"
      - "scripts/verify_foundation_contracts.py"
      - "scripts/audit_function_apis.py"
      - "scripts/verify_function_contracts.py"
      - "scripts/check_function_starters.py"
      - "scripts/verify_algorithm_contracts.py"
      - "scripts/verify_text_file_contracts.py"
      - "CURRICULUM_ORDER.md"
      - ".github/workflows/gauntlex-audit.yml"
  pull_request:
    paths:
      - "gauntlex/**"
      - "scripts/audit_gauntlex.py"
      - "scripts/source_traceability.py"
      - "scripts/check_foundations_starters.py"
      - "scripts/verify_foundation_contracts.py"
      - "scripts/audit_function_apis.py"
      - "scripts/verify_function_contracts.py"
      - "scripts/check_function_starters.py"
      - "scripts/verify_algorithm_contracts.py"
      - "scripts/verify_text_file_contracts.py"
      - "CURRICULUM_ORDER.md"
      - ".github/workflows/gauntlex-audit.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check task metadata, structure, and Python syntax
        run: python scripts/audit_gauntlex.py
      - name: Report source mapping coverage
        run: python scripts/source_traceability.py
      - name: Install pytest for foundational smoke checks
        run: python -m pip install pytest
      - name: Verify incomplete starter programs are rejected
        run: python scripts/check_foundations_starters.py
      - name: Verify first ten contracts against private reference programs
        run: python scripts/verify_foundation_contracts.py
      - name: Verify documented function APIs
        run: python scripts/audit_function_apis.py
      - name: Verify function assignment reference implementations
        run: python scripts/verify_function_contracts.py
      - name: Verify function starters are rejected
        run: python scripts/check_function_starters.py
      - name: Verify algorithm contracts and unfinished starters
        run: python scripts/verify_algorithm_contracts.py
      - name: Verify text and file contracts and unfinished starters
        run: python scripts/verify_text_file_contracts.py
